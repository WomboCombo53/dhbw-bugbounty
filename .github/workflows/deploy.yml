name: Deploy to Kubernetes

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Minikube Deployment Instructions
        run: |
          echo "🚀 **Minikube Deployment Instructions**"
          echo ""
          echo "To run this application locally with Minikube:"
          echo ""
          echo "1. Pull the container images:"
          echo "   docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend@${{ inputs.frontend-image-digest }}"
          echo "   docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend@${{ inputs.backend-image-digest }}"
          echo ""
          echo "2. Start Minikube:"
          echo "   minikube start"
          echo ""
          echo "3. Apply Kubernetes manifests:"
          echo "   kubectl apply -f infrastructure/k8s/"
          echo ""
          echo "4. Access the application:"
          echo "   minikube service frontend"
