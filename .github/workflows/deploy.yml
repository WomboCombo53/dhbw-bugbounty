name: Deploy to Kubernetes

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Minikube Deployment Instructions
        run: |
          echo "🚀 **Minikube Deployment Instructions**"
          echo ""
          echo "To run this application locally with Minikube:"
          echo ""
          echo "1. Go to project's root directory"
          echo "2. Run the makefile: `make`"
